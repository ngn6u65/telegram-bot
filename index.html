<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Telegram Hub</title>
  <meta name="description" content="All my Telegram Bots & Channels in one place">
  <meta name="theme-color" content="#0f0f1a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Background Effects -->
  <div class="bg-effects">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🚀</div>
        <div class="logo-text">Telegram<span>Hub</span></div>
      </a>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <ul class="nav-links">
        <li><a href="#bots">Bots</a></li>
        <li><a href="#channels">Channels</a></li>
      </ul>
      <a href="admin.html" class="admin-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Admin
      </a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <div class="hero-badge">
        <span class="dot"></span>
        All links updated & active
      </div>
      <h1 id="site-title">My Telegram <span class="highlight">Hub</span></h1>
      <p id="site-description">All my Telegram Bots & Channels in one place — never lose them!</p>

      <div class="hero-stats">
        <div class="stat-item">
          <div class="stat-number" id="stat-bots">0</div>
          <div class="stat-label">Bots</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="stat-channels">0</div>
          <div class="stat-label">Channels</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="stat-visitors">0</div>
          <div class="stat-label">Visitors</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Bots Section -->
  <section class="section" id="bots">
    <div class="container">
      <div class="section-header">
        <div class="section-title">
          <div class="icon">🤖</div>
          <h2>Bots</h2>
          <span class="count" id="bots-count">0</span>
        </div>
      </div>
      <div class="cards-grid" id="bots-grid">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <!-- Channels Section -->
  <section class="section" id="channels">
    <div class="container">
      <div class="section-header">
        <div class="section-title">
          <div class="icon">📢</div>
          <h2>Channels</h2>
          <span class="count" id="channels-count">0</span>
        </div>
      </div>
      <div class="cards-grid" id="channels-grid">
        <div class="loading-spinner"><div class="spinner"></div></div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-left">
          <div class="footer-text">Made by <strong>Masha</strong></div>
          <div class="footer-text">All bots & channels are managed by the owner.</div>
        </div>
        <div class="visitor-counter">
          <span class="counter-icon">👁</span>
          <div>
            <div class="counter-label">Total Visitors</div>
            <div class="counter-number" id="visitor-count">0</div>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    // Also update hero visitor stat
    const origTrack = trackVisitor;
    function trackVisitorWithStat() {
      origTrack();
      const count = parseInt(localStorage.getItem('tghub_visitors') || '0');
      const heroStat = document.getElementById('stat-visitors');
      if (heroStat) animateCounter(heroStat, count);
    }
    trackVisitorWithStat();
  </script>
</body>
</html>
